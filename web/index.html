<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rezina Loop Machine</title>
<meta name="description" content="A rubber band as a musical instrument: stretch it, bend it, tilt and shake the phone, loop four tracks.">
<meta name="theme-color" content="#101016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  html, body { margin: 0; height: 100%; background: #101016; overflow: hidden; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
  #safe { position: absolute; visibility: hidden; padding-top: env(safe-area-inset-top); }
  noscript { color: #ccc; font: 18px system-ui, sans-serif; display: block; padding: 24px; }
</style>
</head>
<body>
<div id="safe"></div>
<canvas id="band"></canvas>
<noscript>Rezina needs JavaScript.</noscript>
<script type="module" src="app.js"></script>

</html>
